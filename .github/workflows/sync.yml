name: Sync AI rules

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build merged Loon list
        run: bash scripts/update.sh
      - name: Commit changes when needed
        run: |
          git add -- Loon/AI.list
          if git diff --cached --quiet; then
            echo "No upstream rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync AI rules"
          git push
